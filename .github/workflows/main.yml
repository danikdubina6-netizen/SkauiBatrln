name: Run Telegram Downloader Bot

on:
  schedule:
    # Запуск каждые 5 часов (в 0:00, 5:00, 10:00, 15:00, 20:00 по UTC)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Чтобы можно было запустить вручную кнопкой в репозитории

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg (needed for audio conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        run: |
          python bot.py
          
