name: Run Anonymous Bot

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Запуск каждые 5 часов (в 00:00, 05:00, 10:00, 15:00, 20:00 по UTC)
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
        
